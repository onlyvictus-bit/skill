name: optional knowledge runtime
on:
  push:
    branches: [main, development/**, release/**]
  pull_request:
jobs:
  isolated-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create separate pinned runtime
        shell: python
        run: |
          import pathlib, subprocess, sys
          subprocess.run([sys.executable, '-m', 'venv', '.knowledge-runtime'], check=True)
          exe = pathlib.Path('.knowledge-runtime') / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
          subprocess.run([str(exe), '-m', 'pip', 'install', '-r', 'semantica-runtime/requirements-lock.txt'], check=True)
      - name: Report observed Semantica wheel content digest (non-secret)
        shell: python
        run: |
          import csv, importlib.metadata, pathlib, sys
          exe = pathlib.Path('.knowledge-runtime') / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
          script = ('import csv,importlib.metadata,io; '
                    'd=importlib.metadata.distribution("semantica"); '
                    'r=list(csv.reader(io.StringIO(d.read_text("RECORD")))); '
                    'print("SEMANTICA_INIT_WHEEL_RECORD",'
                    'next((x[1] for x in r if x[0]=="semantica/__init__.py"),"ABSENT"))')
          import subprocess
          subprocess.run([str(exe), '-c', script], check=True)
      - name: Real runtime and protected workflow checks
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          exe = pathlib.Path('.knowledge-runtime') / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
          env = dict(os.environ, KNOWLEDGE_WORKER_PYTHON=str(exe.absolute()), PYTHONDONTWRITEBYTECODE='1')
          subprocess.run([sys.executable, '-B', '-m', 'unittest', 'discover', '-s', 'memory-integrity/tests_v2', '-p', 'test_knowledge*.py'], check=True, env=env)
          subprocess.run([sys.executable, '-B', 'release/Verify-Knowledge-Bridge.py'], check=True, env=env)
