name: ci

on:
  push:
    branches: [main, development/**, release/**]
  pull_request:

permissions:
  contents: read

jobs:
  reproducible-pair:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
      - name: Reproduce exact qualified ZIP and manifest bytes
        run: python -B release/Check-Offline-First-CI.py --rebuild-exact --output-dir "${{ runner.temp }}/offline-reproducible"
      - name: Retain byte-rebuild evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-reproducible-${{ github.sha }}
          path: ${{ runner.temp }}/offline-reproducible/**
          if-no-files-found: error
          retention-days: 14
  suites:
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create clean stdlib-only test interpreter
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'offline-core-runtime'
          subprocess.run([sys.executable, '-m', 'venv', '--copies', '--without-pip', str(root)], check=True)
          binary = root / ('Scripts' if sys.platform == 'win32' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              stream.write(str(binary)+'\n')
      - name: Exact qualified pair and historical release integrity
        run: python -B release/Check-Offline-First-CI.py --output-dir "${{ runner.temp }}/offline-pair"
      - name: Source package suites
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'offline-source'
          for package in ('memory-integrity', 'claude-mon'):
              for tests in ('tests', 'tests_v2'):
                  subprocess.run([sys.executable, '-B', '.github/scripts/offline_ci_suite.py',
                      '--package-root', str(root/package), '--test-dir', tests,
                      '--output-dir', str(output/(package+'-'+tests))], check=True)
      - name: Fresh extracted package suites
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          extracted = temp / 'offline-pair/verified/extracted'
          for package in ('memory-integrity', 'claude-mon'):
              for tests in ('tests', 'tests_v2'):
                  subprocess.run([sys.executable, '-B', '.github/scripts/offline_ci_suite.py',
                      '--package-root', str(extracted/package), '--test-dir', tests,
                      '--output-dir', str(temp/'offline-extracted'/(package+'-'+tests))], check=True)
      - name: repository release/workflow contract tests
        run: python -B .github/scripts/offline_ci_suite.py --package-root . --test-dir .github/tests --output-dir "${{ runner.temp }}/offline-controller"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: behavioral eval self-tests
        working-directory: evals
        run: python -B -m unittest discover -s .
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: content manifests match tree
        shell: python
        run: |
          import hashlib, importlib.util, json, pathlib
          for pkg in ("memory-integrity", "claude-mon"):
              root = pathlib.Path(pkg)
              module = "integrity_v2" if pkg == "memory-integrity" else "complete_read_v2"
              spec = importlib.util.spec_from_file_location("content_"+module, root / "scripts" / module / "release_content.py")
              consumer = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(consumer)
              name = pathlib.Path(consumer.selected_name(root)).name
              manifest = consumer.verify_content(root)
              actual = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                        for p in root.rglob("*") if p.is_file()
                        and "__pycache__" not in p.parts and p.suffix != ".pyc"
                        and p.relative_to(root).as_posix() != "tests_v2/" + name}
              assert actual == manifest["files"], "regenerate %s after intended change" % name
      - name: skill frontmatter validation (stdlib)
        run: python -B .github/scripts/validate-frontmatter.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: no cache, secrets, databases, or unsafe archive members
        shell: python
        run: |
          import pathlib, re, subprocess, zipfile
          secret_re = re.compile(r"(?i)(?<![A-Za-z0-9_.])(?:[A-Za-z]+_)?(api[_-]?key|secret|token|password)['\"]?\s*[:=]\s*['\"][A-Za-z0-9_\-]{12,}")
          bad = []
          # Scan delivered Git files; test-owned retained logs are CI artifacts.
          for rel in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if not rel:
                  continue
              p = pathlib.Path(rel)
              assert p.is_file() and not p.is_symlink(), rel
              if p.suffix in (".pyc",) or p.name in (".pytest_cache", "__pycache__"):
                  bad.append(rel)
              elif p.suffix in (".db", ".sqlite", ".sqlite3"):
                  bad.append(rel)
              elif p.suffix in (".py", ".md", ".json", ".yaml", ".yml", ".toml") \
                      or p.name == ".env" or p.name.startswith(".env."):
                  try:
                      text = p.read_text(encoding="utf-8")
                  except (OSError, ValueError):
                      continue
                  for match in secret_re.finditer(text):
                      # This exact inert filtering fixture is deliberately fake.
                      if rel == '.github/tests/test_cache_cause_probe.py' and match.group(0) == "TOKEN" + "':'" + "secret-value":
                          continue
                      bad.append(rel + ":possible-secret")
          assert not bad, bad
          for z in list(pathlib.Path("release").glob("*.zip")):
              names = zipfile.ZipFile(z).namelist()
              assert len(names) == len(set(names)), z
              assert sum(n.endswith("/SKILL.md") for n in names) == 1, z
              assert not any("__pycache__" in n or n.endswith(".pyc") or ".." in pathlib.Path(n).parts for n in names), z
      - name: Retain exact-commit CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-core-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.sha }}
          path: ${{ runner.temp }}/offline-*/**
          if-no-files-found: error
          retention-days: 14
